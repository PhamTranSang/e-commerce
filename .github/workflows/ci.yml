name: CI

# Provider decision: GitHub Actions (repo targets GitHub, default branch `main`).
# CI is the automated gate: a clean, from-scratch build that also packages the
# bootable jar (the deployable artifact).

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Clean, from-scratch build: compiles, runs checks, and packages the
      # bootable jar. `clean` is intentional for CI (reproducible artifact),
      # unlike the local dev loop which builds incrementally.
      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
