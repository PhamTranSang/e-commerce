spring:
  application:
    name: e-commerce
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only validates the mapping.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

# app.security.jwt (secret + issuer + ttl) is declared entirely in
# environment/application.yaml (git-ignored) — see environment/application.example.yaml.

logging:
  level:
    root: INFO
    app.ecommerce: DEBUG
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Expose only health; nothing that could leak configuration.
        include: health,startup
  endpoint:
    health:
      probes:
        enabled: true
      # Never render component details (JDBC URL, etc.) on the public endpoint.
      show-details: never
      show-components: never
      group:
        readiness:
          # Readiness reflects the real database dependency.
          include: readinessState,db
